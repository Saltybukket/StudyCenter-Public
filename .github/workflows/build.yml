name: Public tests and native build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      beta2_release:
        description: 'One-off checked packages for the existing beta.2 draft'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.beta2_release
    permissions:
      contents: read
    strategy: &native_platforms
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env: &native_environment
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/browser-runtime
      RELEASE_TAG: ${{ inputs.beta2_release && 'v0.1.0-beta.2' || '' }}
    steps: &native_steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated Python environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "TASK_PYTHON=$GITHUB_WORKSPACE/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "TASK_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Install locked public dependencies in own environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$TASK_PYTHON" -m pip install -r requirements-windows.lock
          else
            "$TASK_PYTHON" -m pip install -r requirements-linux.lock
          fi
          "$TASK_PYTHON" -m pip install --no-deps -e .
      - name: Unit and local protocol tests
        shell: bash
        run: '"$TASK_PYTHON" -m pytest -q'
      - name: Reuse verified notices for the one-off beta.2 draft
        if: inputs.beta2_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$TASK_PYTHON" - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tomllib, urllib.request, zipfile
          root=pathlib.Path.cwd()
          if tomllib.loads((root/'pyproject.toml').read_text())['project']['version']!='0.1.0b2':
              raise ValueError('This one-off path accepts only beta.2')
          draft=json.loads(subprocess.check_output(['gh','release','view',os.environ['RELEASE_TAG'],'--json','isDraft,targetCommitish']))
          if not draft['isDraft'] or draft['targetCommitish']!=os.environ['GITHUB_SHA']:
              raise ValueError('Only the existing unpublished draft for this exact commit may receive files')
          completion=json.loads((root/'packaging/component-notices.json').read_text())
          companion=completion['source_companion']
          archive=root/'build'/companion['filename']; archive.parent.mkdir(exist_ok=True)
          url='https://github.com/Saltybukket/StudyCenter-Public/releases/download/v0.1.0-beta.1/'+companion['filename']
          with urllib.request.urlopen(url,timeout=180) as source, archive.open('wb') as output:
              shutil.copyfileobj(source,output,1024*1024)
          with archive.open('rb') as source:
              if hashlib.file_digest(source,'sha256').hexdigest()!=companion['sha256']:
                  raise ValueError('Published component source checksum differs')
          destination=(root/'build/license-materials').resolve()
          with zipfile.ZipFile(archive) as source:
              for name,record in completion['files'].items():
                  output=(destination/name).resolve()
                  if not output.is_relative_to(destination): raise ValueError('Invalid notice path')
                  output.parent.mkdir(parents=True,exist_ok=True)
                  with source.open('license-materials/'+name) as member, output.open('wb') as target:
                      shutil.copyfileobj(member,target)
                  with output.open('rb') as target: actual=hashlib.file_digest(target,'sha256').hexdigest()
                  if actual!=record['sha256'] or output.stat().st_size!=record['size']:
                      raise ValueError('Notice checksum differs: '+name)
          PY
      - name: Download own official browser components
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$TASK_PYTHON" -m playwright install chromium --no-shell
          else
            "$TASK_PYTHON" -m playwright install chromium
          fi
      - name: Extract fresh portable Windows OCR
        if: runner.os == 'Windows'
        shell: bash
        run: '"$TASK_PYTHON" scripts/build_windows_ocr.py --output build/windows-ocr'
      - name: Extract portable Linux OCR
        if: runner.os == 'Linux'
        shell: bash
        run: '"$TASK_PYTHON" scripts/build_linux_ocr.py --output build/linux-ocr'
      - name: Stage pinned unbranded Windows Chromium
        if: runner.os == 'Windows'
        shell: bash
        run: '"$TASK_PYTHON" scripts/build_browser_runtime.py --platform windows --original build/browser-runtime --output build/unbranded-browser-runtime'
      - name: Stage pinned unbranded Linux Chromium and licensed headless shell
        if: runner.os == 'Linux'
        shell: bash
        run: '"$TASK_PYTHON" scripts/build_browser_runtime.py --platform linux --original build/browser-runtime --output build/unbranded-browser-runtime'
      - name: Validate own Windows browser stage before freezing
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$TASK_PYTHON" - <<'PY'
          import json, os, pathlib, subprocess, playwright
          root=pathlib.Path.cwd().resolve()
          runtime=(root/'build/unbranded-browser-runtime/runtime').resolve(strict=True)
          if not runtime.is_relative_to(root/'build') or os.environ.get('PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS'):
              raise ValueError('Own browser stage and active dependency validation are required')
          driver=pathlib.Path(playwright.__file__).resolve().parent/'driver'
          script=root/'build/validate-own-windows-browser-stage.js'
          script.write_text('const {registry}=require('+json.dumps(str(driver/'package/lib/coreBundle.js'))+').registry;(async()=>{await registry.validateHostRequirementsForExecutablesIfNeeded([registry.findExecutable("chromium")],"javascript");console.log("Own Windows browser dependency validation finished before freeze");})().catch(error=>{console.error(error);process.exitCode=1;});',encoding='utf-8')
          child=dict(os.environ,PLAYWRIGHT_BROWSERS_PATH=str(runtime))
          subprocess.run([str(driver/'node.exe'),str(script)],env=child,check=True,timeout=90)
          PY
      - name: Freeze Windows bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ISCC_PATH=$("$TASK_PYTHON" -c 'from scripts.smoke_installer_vm import compiler; print(compiler())')
            "$TASK_PYTHON" scripts/build_release.py --ocr-dir build/windows-ocr/runtime --browsers-dir build/unbranded-browser-runtime/runtime --source-commit "$GITHUB_SHA" --iscc "$ISCC_PATH"
          else
            "$TASK_PYTHON" scripts/build_release.py --ocr-dir build/windows-ocr/runtime --browsers-dir build/unbranded-browser-runtime/runtime --source-commit "$GITHUB_SHA" --allow-missing-component-notices
          fi
      - name: Freeze Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            "$TASK_PYTHON" scripts/build_release.py --ocr-dir build/linux-ocr/runtime --browsers-dir build/unbranded-browser-runtime/runtime --source-commit "$GITHUB_SHA"
          else
            "$TASK_PYTHON" scripts/build_release.py --ocr-dir build/linux-ocr/runtime --browsers-dir build/unbranded-browser-runtime/runtime --source-commit "$GITHUB_SHA" --allow-missing-component-notices
          fi
      - name: Read-only Linux sandbox prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for parameter in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
            sysctl "$parameter" || true
          done
          unshare --user --map-root-user /usr/bin/true && echo 'Own user namespace probe: allowed' || echo 'Own user namespace probe: refused'
          sudo -n journalctl -k --no-pager -n 100 | grep -E 'apparmor|userns' || true
      - name: Synthetic Windows package smoke
        if: runner.os == 'Windows'
        shell: bash
        run: '"$TASK_PYTHON" scripts/smoke_release.py dist/windows/StudyCenter-Public/StudyCenter-Public.exe --output build/smoke'
      - name: Independent Linux core package smoke
        if: runner.os == 'Linux'
        shell: bash
        run: '"$TASK_PYTHON" scripts/smoke_release.py dist/linux/StudyCenter-Public/StudyCenter-Public --core-only --output build/core-smoke'
      - name: Separate bundled Linux browser probe
        id: linux-bundled-browser
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: '"$TASK_PYTHON" scripts/smoke_release.py dist/linux/StudyCenter-Public/StudyCenter-Public --output build/browser-smoke'
      - name: Report separate Linux acceptance scopes
        if: always() && runner.os == 'Linux'
        shell: bash
        env:
          BUNDLED_BROWSER_OUTCOME: ${{ steps.linux-bundled-browser.outcome }}
        run: |
          if [ "$BUNDLED_BROWSER_OUTCOME" = "success" ]; then
            echo 'Bundled Linux browser probe: PASS for this VM.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Bundled Linux browser probe: BLOCKED or not run. Core/UI and source-browser acceptance are separate; a green job is not full Linux acceptance.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Installer lifecycle in disposable Windows runner only
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            "$TASK_PYTHON" scripts/smoke_installer_vm.py --installer dist/windows/studycenter-public-0.1.0b2-windows-x86_64-setup.exe --expected-source "$GITHUB_SHA"
          else
            "$TASK_PYTHON" scripts/smoke_installer_vm.py
          fi
      - name: Inspect unpacked bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$TASK_PYTHON" scripts/package_audit.py dist/windows/StudyCenter-Public/StudyCenter-Public.exe
            "$TASK_PYTHON" scripts/check_public.py --artifact dist/windows/StudyCenter-Public --artifact-reviews scripts/artifact_reviews.json
          else
            "$TASK_PYTHON" scripts/package_audit.py dist/linux/StudyCenter-Public/StudyCenter-Public
            "$TASK_PYTHON" scripts/check_public.py --artifact dist/linux/StudyCenter-Public --artifact-reviews scripts/artifact_reviews.json
          fi
      - name: Attach checked package to the exact unpublished beta.2 draft
        if: inputs.beta2_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$TASK_PYTHON" - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          from scripts.build_release import validate_component_notices
          root=pathlib.Path.cwd(); platform='windows' if sys.platform=='win32' else 'linux'
          draft=json.loads(subprocess.check_output(['gh','release','view',os.environ['RELEASE_TAG'],'--json','isDraft,targetCommitish']))
          if not draft['isDraft'] or draft['targetCommitish']!=os.environ['GITHUB_SHA']:
              raise ValueError('Draft identity changed; upload cancelled')
          validate_component_notices(root/'dist'/platform/'StudyCenter-Public')
          suffix='-setup.exe' if platform=='windows' else '.tar.gz'
          package=root/'dist'/platform/f'studycenter-public-0.1.0b2-{platform}-x86_64{suffix}'
          with package.open('rb') as source: digest=hashlib.file_digest(source,'sha256').hexdigest()
          checksum=package.parent/f'SHA256SUMS-{platform}'
          checksum.write_text(digest+'  '+package.name+'\n')
          subprocess.run(['gh','release','upload',os.environ['RELEASE_TAG'],str(package),str(checksum)],check=True)
          print('Checked draft package:',package.name,digest)
          PY
      # No Actions cache/artifact storage. The explicitly approved one-off build
      # only attaches checked files to a draft; it does not publish the release.
  beta2-release:
    # Explicit user approval covers only this manual beta.2 build. Remove this
    # job after its two platform packages have been obtained.
    if: github.event_name == 'workflow_dispatch' && inputs.beta2_release
    permissions:
      contents: write
    strategy: *native_platforms
    runs-on: ${{ matrix.os }}
    env: *native_environment
    steps: *native_steps
