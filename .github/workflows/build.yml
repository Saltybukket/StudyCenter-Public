name: Public tests and slim native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Preserve committed source bytes on checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated locked controller and tests
        shell: pwsh
        run: |
          python -m venv .venv
          $python = if ($env:RUNNER_OS -eq 'Windows') { "$pwd/.venv/Scripts/python.exe" } else { "$pwd/.venv/bin/python" }
          "TASK_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $python -m pip install -r "requirements-$env:PLATFORM.lock"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify pinned product source inventory
        shell: pwsh
        run: |
          & $env:TASK_PYTHON scripts/sync_product.py verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:TASK_PYTHON scripts/check_product_architecture.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build exact source wheel and seed pinned components
        shell: pwsh
        run: |
          $assets = "$pwd/.local/build/slim"
          & $env:TASK_PYTHON -m pip wheel --no-deps --no-build-isolation --wheel-dir "$pwd/.local/build/wheels" .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:TASK_PYTHON scripts/prepare_slim_assets.py --platform $env:PLATFORM --output $assets --previous-output "$pwd/.local/build/previous"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = & $env:TASK_PYTHON -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -cnotmatch '^(\d+\.\d+\.\d+)b([1-9][0-9]*)$') { throw 'Expected explicit beta version' }
          $tag = "v$($Matches[1])-beta.$($Matches[2])"
          $wheel = "$pwd/.local/build/wheels/studycenter_public-$version-py3-none-any.whl"
          $arguments = @('scripts/build_slim.py','--platform',$env:PLATFORM,'--reuse-components','--release-tag',$tag,'--wheel',$wheel,'--source-commit',$env:GITHUB_SHA,'--output',$assets)
          if ($env:PLATFORM -eq 'windows') {
            $compiler = & $env:TASK_PYTHON -c "from scripts.smoke_installer_vm import compiler; print(compiler())"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $arguments += @('--iscc', $compiler)
          }
          & $env:TASK_PYTHON @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "CANDIDATE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Scan application wheel and unpacked bootstrap
        shell: pwsh
        run: |
          $assets = "$pwd/.local/build/slim"
          & $env:TASK_PYTHON scripts/check_public.py --artifact "$assets/studycenter_public-$env:CANDIDATE_VERSION-py3-none-any.whl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:TASK_PYTHON scripts/check_public.py --artifact "$assets/$env:PLATFORM-bootstrap"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:PLATFORM -eq 'windows') {
            & $env:TASK_PYTHON scripts/scan_slim_installer.py --installer "$assets/studycenter-public-$env:CANDIDATE_VERSION-windows-x86_64-setup.exe" --bootstrap "$assets/windows-bootstrap" --output "$pwd/.local/build/installer-scan"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $env:TASK_PYTHON scripts/scan_slim_components.py --platform $env:PLATFORM --assets $assets --output "$pwd/.local/build/component-scan"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Synthetic installer and isolated package lifecycle
        shell: pwsh
        run: |
          $assets = "$pwd/.local/build/slim"
          $smokeArguments = @('scripts/smoke_slim.py','--assets',$assets,'--expected-source',$env:GITHUB_SHA)
          if ($env:PLATFORM -eq 'windows') {
            $smokeArguments += @('--installer', "$assets/studycenter-public-$env:CANDIDATE_VERSION-windows-x86_64-setup.exe", '--previous-installer', "$pwd/.local/build/previous/studycenter-public-0.1.0b5-windows-x86_64-setup.exe")
          } else {
            $smokeArguments += @('--archive', "$assets/studycenter-public-$env:CANDIDATE_VERSION-linux-x86_64-slim.tar.gz", '--previous-archive', "$pwd/.local/build/previous/studycenter-public-0.1.0b5-linux-x86_64-slim.tar.gz")
          }
          & $env:TASK_PYTHON @smokeArguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # No Actions cache, stored artifacts, release creation, or publication.
